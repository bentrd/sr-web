# Fly.io config for the snapshot-relay server.
#
# IMPORTANT: deploy from the REPO ROOT, not from apps/server/. The Dockerfile
# COPYs from packages/protocol/ which is outside this directory, so the build
# context must include the whole repo:
#
#   cd <repo-root>
#   fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile --remote-only

app = "sr-web-server"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # WebSocket upgrade requests need the same listener as plain HTTP.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
