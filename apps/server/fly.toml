# Fly.io config for the snapshot-relay server.
#
# IMPORTANT: deploy from the REPO ROOT, not from apps/server/. The Dockerfile
# COPYs from packages/protocol/ which is outside this directory, so the build
# context must include the whole repo:
#
#   cd <repo-root>
#   fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile --remote-only

app = "sr-web-server"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  # Rooms live in-process. A second machine would split the cluster
  # (friends could land on a node that doesn't know about your room),
  # so pin to exactly one machine and disable HA.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  # WebSocket upgrade requests need the same listener as plain HTTP.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Persistent volume so the SQLite leaderboard survives deploys.
# One-time setup: fly volumes create leaderboard_data --region cdg --size 1
[mounts]
  source = "leaderboard_data"
  destination = "/data"

[env]
  PORT = "4000"
  LEADERBOARD_DB_PATH = "/data/leaderboard.db"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256